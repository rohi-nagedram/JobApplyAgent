INDIA = ["hyderabad", "bengaluru", "bangalore", "india"]


def get(url):
    req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
    with urllib.request.urlopen(req, timeout=20) as r:
        return json.loads(r.read().decode("utf-8"))


def check(item):
    kind, slug = item
    try:
        if kind == "greenhouse":
            data = get(f"https://boards-api.greenhouse.io/v1/boards/{slug}/jobs")
            locs = [((j.get("location") or {}).get("name") or "").lower() for j in data.get("jobs", [])]
        else:
            data = get(f"https://api.lever.co/v0/postings/{slug}?mode=json")
            locs = [((j.get("categories") or {}).get("location") or "").lower() for j in data]
        n = sum(1 for l in locs if any(k in l for k in INDIA))
        return kind, slug, len(locs), n, ""
    except urllib.error.HTTPError as e:
        return kind, slug, -1, 0, f"HTTP {e.code}"
    except Exception as e:
        return kind, slug, -1, 0, type(e).__name__


def main():
    items = [("greenhouse", s) for s in dict.fromkeys(GH)] + [("lever", s) for s in dict.fromkeys(LV)]
    with ThreadPoolExecutor(12) as ex:
        res = list(ex.map(check, items))
    ok = sorted([r for r in res if r[2] >= 0], key=lambda r: -r[3])
    print("WORKING BOARDS (source, name, total jobs, India jobs):")
    for k, s, t, n, _ in ok:
        print(f"  {k:10} {s:32} total={t:5} india={n}")
    print("\nWORKING WITH 1+ INDIA JOBS (copy these into boards.json):")
    print("  greenhouse:", [s for k, s, t, n, _ in ok if k == "greenhouse" and n > 0])
    print("  lever:     ", [s for k, s, t, n, _ in ok if k == "lever" and n > 0])
    print(f"\n{len(ok)} working, {len(res) - len(ok)} not found.")


if __name__ == "__main__":
    main()
    
