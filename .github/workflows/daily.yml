
name: Daily Job Search and Resume Drafts

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run job search
        run: python run.py

      - name: Upload job results
        uses: actions/upload-artifact@v4
        with:
          name: job-application-review
          path: |
            data/jobs.csv
            data/jobs.json
            data/source-errors.txt
            data/approval_queue.json
            data/applications.csv
            data/prepared/
          if-no-files-found: warn
          retention-days: 30
